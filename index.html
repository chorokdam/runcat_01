<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>블랙캣 런: 숲속 질주</title>
<meta name="theme-color" content="#000000">
<style>
:root{--lime:#5fee03;--black:#000;--white:#fff;--sky:#36aef4;--orange:#ff8a00;--gray:#a8a8a8;}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:"Courier New",monospace;
}
body{
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}
#app{
  position:relative;
  width:min(100vw, calc(100dvh * 390 / 844));
  height:min(100dvh, calc(100vw * 844 / 390));
  max-width:430px;
  max-height:100dvh;
  aspect-ratio:390 / 844;
  background:#000;
  overflow:hidden;
  touch-action:none;
  flex:0 0 auto;
}
canvas{
  position:absolute;inset:0;
  display:block;width:100%;height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  background:var(--sky);
}
#start,#modal{
  position:absolute;inset:0;z-index:20;background:#000;color:#fff;
  display:flex;align-items:center;justify-content:center;padding:22px;text-align:center
}
#modal{display:none}
.panel{width:100%;max-width:340px}
.title{font-size:42px;font-weight:900;line-height:.95;margin-bottom:8px}
.title .g{color:var(--lime)}
.sub{color:var(--lime);font-size:21px;font-weight:900;margin-bottom:20px}
.start-preview{
  height:160px;position:relative;overflow:hidden;background:#36aef4;margin-bottom:18px;
  border:4px solid #111;
}
.start-preview:after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:#5fee03;
box-shadow:0 10px 0 #68461f,0 20px 0 #68461f}
.start-preview img{position:absolute;image-rendering:pixelated}
.preview-tree{height:118px;left:14px;bottom:20px}
.preview-cat{height:64px;left:120px;bottom:20px}
.preview-mouse{height:48px;right:24px;bottom:20px}
.instructions{line-height:1.6;font-size:14px;margin:14px 0 18px}
button{
  width:100%;padding:15px;border:0;background:var(--lime);color:#000;
  font:bold 23px "Courier New",monospace;cursor:pointer
}
.hint{font-size:12px;color:#bbb;margin-top:11px}
#hud{position:absolute;top:12px;left:12px;right:12px;z-index:8;display:none;justify-content:space-between;
font-weight:900;color:#111;text-shadow:1px 1px #fff;pointer-events:none}
#pause{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;z-index:9;
width:42px;height:42px;padding:0;background:#111;color:#fff;border:3px solid #fff;border-radius:5px}
#sound{position:absolute;right:10px;bottom:10px;z-index:9;display:none;width:42px;height:42px;padding:0;
background:#111;color:#fff;border:2px solid #fff;border-radius:50%;font-size:18px}

#rotateHint{
  display:none;
  position:absolute;left:50%;bottom:56px;transform:translateX(-50%);
  z-index:30;background:rgba(0,0,0,.78);color:#fff;
  padding:8px 12px;border-radius:8px;font-size:11px;white-space:nowrap;
  pointer-events:none;
}
@media (orientation:landscape) and (max-height:520px){
  #rotateHint{display:block}
}
@media (max-width:360px){
  .title{font-size:36px}
  .sub{font-size:18px}
  .instructions{font-size:12px}
  button{font-size:20px;padding:13px}
}
</style>
</head>
<body>
<div id="app">
<canvas id="game" width="390" height="844"></canvas>
<div id="rotateHint">세로 화면으로 보면 가장 잘 보여요.</div>

let state='ready',stage=1,score=0,best=+localStorage.getItem('bc_mobile_best')||0,tick=0,speed=2.7;
let audioCtx=null,bgmTimer=null,soundOn=true;
const cat={x:64,y:610,w:58,h:45,vy:0,g:.55,jump:-10.5,ground:false};
let plats=[],items=[],decor=[];

function audio(){if(!audioCtx)audioCtx=new (AudioContext||webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(f,d=.1,type='square',v=.035,delay=0){if(!soundOn||!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d);}
function meow(){if(!soundOn)return;audio();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.type='triangle';
 o.frequency.setValueAtTime(500,n);o.frequency.linearRampToValueAtTime(760,n+.09);o.frequency.linearRampToValueAtTime(600,n+.24);
 g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+.25);}
function itemFx(type){audio();if(type==='fish'){tone(700,.08,'square',.05);tone(950,.09,'square',.04,.07)}else{tone(520,.07,'square',.05);tone(800,.08,'square',.04,.07);tone(1050,.1,'square',.03,.14)}setTimeout(meow,150);}
function bgm(){stopBgm();audio();let a=[262,330,392,330,294,349,440,349],i=0;function n(){if(state!=='playing'||!soundOn)return;tone(a[i],.18,'triangle',.012);i=(i+1)%a.length;bgmTimer=setTimeout(n,350)}n();}
function stopBgm(){if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null}}

function setup1(){stage=1;score=0;tick=0;speed=2.7;cat.y=610;cat.vy=0;
 plats=[{x:-20,y:690,w:250,base:690,phase:0},{x:300,y:660,w:165,base:660,phase:1},{x:520,y:710,w:160,base:710,phase:2}];
 items=[{x:335,y:610,type:'fish',hit:false},{x:555,y:660,type:'mouse',hit:false}];
 decor=[{x:18,y:690,type:'tree',s:1},{x:250,y:660,type:'fruit',s:1},{x:210,y:690,type:'flower',s:.7}];}
function setup2(){stage=2;speed=3.5;cat.y=530;cat.vy=0;
 plats=[{x:-20,y:720,w:110,base:720,phase:0},{x:155,y:610,w:110,base:610,phase:1.5},{x:330,y:730,w:115,base:730,phase:3},{x:520,y:650,w:115,base:650,phase:4.4}];
 items=[{x:190,y:560,type:'fish',hit:false},{x:365,y:680,type:'mouse',hit:false}];
 decor=[{x:18,y:720,type:'tree',s:.7},{x:300,y:730,type:'flower',s:.7},{x:520,y:650,type:'tree',s:.7}];}

function startGame(){audio();setup1();start.style.display='none';modal.style.display='none';hud.style.display='flex';pause.style.display='block';sound.style.display='block';state='playing';bestEl.textContent=best;bgm();requestAnimationFrame(loop);}
function jump(){if(state!=='playing'||!cat.ground)return;cat.vy=cat.jump;cat.ground=false;tone(330,.06,'square',.025);}
document.getElementById('startBtn').onclick=startGame;
pause.onclick=()=>{if(state==='playing'){state='paused';pause.textContent='▶';stopBgm()}else if(state==='paused'){state='playing';pause.textContent='Ⅱ';bgm();requestAnimationFrame(loop)}};
sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'♪':'×';if(soundOn&&state==='playing')bgm();else stopBgm();};
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='ready'||state==='over')startGame();else jump();}});
cvs.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});

function addPlat(){let l=plats.at(-1);if(!l)return;if(l.x+l.w<480){let gap=(stage===1?65:82)+Math.random()*(stage===1?55:58),y=(stage===1?650:590)+Math.random()*(stage===1?70:125),w=(stage===1?135:110)+Math.random()*55;
 let p={x:l.x+l.w+gap,y,w,base:y,phase:Math.random()*6.28};plats.push(p);if(Math.random()<.82)items.push({x:p.x+30,y:p.y-45,type:Math.random()<.3?'mouse':'fish',hit:false});}}
function motion(){if(stage===2)for(const p of plats)p.y=p.base+Math.sin(tick*.017+p.phase)*18;}
function collide(){cat.ground=false;for(const p of plats){if(cat.x+cat.w>p.x&&cat.x<p.x+p.w&&cat.y+cat.h>=p.y&&cat.y+cat.h-cat.vy<=p.y+12&&cat.vy>=0){cat.y=p.y-cat.h;cat.vy=0;cat.ground=true;}}
 for(const i of items){if(!i.hit&&cat.x<i.x+35&&cat.x+cat.w>i.x&&cat.y<i.y+30&&cat.y+cat.h>i.y){i.hit=true;score+=i.type==='fish'?10:30;itemFx(i.type);}}}

function cloud(x,y){ctx.fillStyle='#fff';ctx.fillRect(x,y+4,34,7);ctx.fillRect(x+9,y,16,12);}
function platform(p){ctx.fillStyle='#65431e';ctx.fillRect(p.x,p.y,p.w,844-p.y);ctx.fillStyle='#5fee03';ctx.fillRect(p.x,p.y,p.w,10);
 ctx.fillStyle='#2d210f';for(let q=10;q<p.w;q+=24)ctx.fillRect(p.x+q,p.y+28+(q%48?10:0),6,5);}
function sprite(im,x,y,h){if(!im.complete)return;let r=im.width/im.height;ctx.drawImage(im,x,y-h,h*r,h);}
function render(){ctx.fillStyle='#36aef4';ctx.fillRect(0,0,390,844);cloud(55-(tick*.04)%470,92);cloud(245-(tick*.025)%520,145);
 for(const d of decor){let im=d.type==='fruit'?IMG.fruit:d.type==='flower'?IMG.flower:IMG.tree;sprite(im,d.x,d.y,d.type==='flower'?45*d.s:125*d.s);}
 for(const p of plats)platform(p);for(const i of items)if(!i.hit)sprite(i.type==='fish'?IMG.fish:IMG.mouse,i.x,i.y,i.type==='fish'?30:47);
 sprite(IMG.cat,cat.x,cat.y+cat.h,62);
 // halftone texture from chosen mockup
 ctx.save();ctx.globalAlpha=.11;ctx.fillStyle='#000';for(let yy=0;yy<844;yy+=7)for(let xx=(yy/7)%2?3:0;xx<390;xx+=7)ctx.fillRect(xx,yy,1,1);ctx.restore();
 if(stage===2){ctx.fillStyle='#111';ctx.font='bold 14px monospace';ctx.fillText('STAGE 2',305,95);}}
function stageClear(){state='clear';stopBgm();modalTitle.innerHTML='<span class="g">STAGE 1</span> CLEAR!';modalSub.textContent='300점 달성!';modalBtn.textContent='STAGE 2 시작';modal.style.display='flex';modalBtn.onclick=()=>{setup2();modal.style.display='none';state='playing';bgm();requestAnimationFrame(loop)};}
function over(){state='over';stopBgm();best=Math.max(best,score);localStorage.setItem('bc_mobile_best',best);bestEl.textContent=best;modalTitle.innerHTML='<span class="g">GAME</span> OVER';modalSub.textContent='다시 도전해보세요!';modalBtn.textContent='다시 시작';modal.style.display='flex';modalBtn.onclick=startGame;}
function update(){tick++;speed=stage===1?Math.min(4.8,2.7+score/280):Math.min(5.6,3.5+Math.max(0,score-300)/340);cat.vy+=cat.g;cat.y+=cat.vy;
 for(const p of plats)p.x-=speed;for(const i of items)i.x-=speed;for(const d of decor)d.x-=speed*.45;motion();plats=plats.filter(p=>p.x+p.w>-40);items=items.filter(i=>i.x>-40&&!i.hit);decor=decor.filter(d=>d.x>-120);addPlat();collide();scoreEl.textContent=score;if(stage===1&&score>=300){stageClear();return}if(cat.y>870){over();return}}
function loop(){if(state!=='playing')return;update();render();if(state==='playing')requestAnimationFrame(loop);}
setup1();bestEl.textContent=best;render();
</script>
</body>
</html>
